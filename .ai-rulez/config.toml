
version = "5.0"
name = 'adrlint'
gitignore = true
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode", "pi"]
builtins = ['rust', 'default-commands']

[lint]
allow_overrides = ["claude:review"]

[lint.builtin_names]
# `fix` and `review` are this project's own commands; their names also exist as
# harness built-ins (copilot, cursor), so the collision is intentional.
allow = ["opencode:review", "copilot:fix", "cursor:review"]

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false
