
version = "5.0"
name = 'adrlint'
gitignore = true
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode", "pi"]
builtins = ['rust', 'default-commands']

[lint]
allow_overrides = ["claude:review"]

[lint.builtin_names]
allow = ["opencode:review"]

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false
