[package]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/tests/**", "/fixtures/**", "/README.md", "/LICENSE"]
name = "adrlint"
version = "0.2.1"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
description = "A fast, opinionated linter and formatter for MADR architecture decision records"
edition = "2024"
# rumdl 0.3 requires Rust 1.94; adrlint links it in rather than shelling out.
rust-version = "1.94"
categories = ["command-line-utilities", "development-tools"]
keywords = ["adr", "architecture", "madr", "linter", "markdown"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Goldziher/adrlint"
homepage = "https://github.com/Goldziher/adrlint"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/adrlint-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "adrlint"
path = "src/lib.rs"

[[bin]]
name = "adrlint"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "color", "wrap_help"] }
dirs = "7.0.0"
glob = "0.3.4"
# Discovery walks the project in parallel and honours .gitignore.
ignore = "0.4"
jiff = "0.2.38"
owo-colors = "4.4.0"
# The Markdown parse is owned by `adr::parse`; no other module may parse the source.
pulldown-cmark = { version = "0.13.5", default-features = false }
# rumdl is linked in-process; its `native` feature pulls the LSP/tokio stack and is not needed.
rumdl = { version = "0.3.2", default-features = false }
saphyr = { version = "0.3.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
