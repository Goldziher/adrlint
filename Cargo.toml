[package]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/tests/**", "/fixtures/**", "/README.md", "/LICENSE"]
name = "adrlint"
version = "0.1.0"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
description = "A fast, opinionated linter and formatter for MADR architecture decision records"
edition = "2024"
# rumdl 0.3 requires Rust 1.94; adrlint links it in rather than shelling out.
rust-version = "1.94"
categories = ["command-line-utilities", "development-tools"]
keywords = ["adr", "architecture", "madr", "linter", "markdown"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Goldziher/adrlint"
homepage = "https://github.com/Goldziher/adrlint"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/adrlint-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "adrlint"
path = "src/lib.rs"

[[bin]]
name = "adrlint"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive", "color", "wrap_help"] }
jiff = "0.2"
owo-colors = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.8"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.27.0"
