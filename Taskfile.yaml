version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and initialize the project. Idempotent."
    cmds:
      - cargo fetch
      - task: ai:hooks
      - echo "Setup complete"

  build:
    desc: Build the adrlint binary
    cmds:
      - cargo build --release

  test:
    desc: Run all tests
    cmds:
      - cargo test

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - cargo test -- --nocapture

  lint:
    desc: Lint the repository with poly
    cmds:
      - poly lint .

  format:
    desc: Format code
    cmds:
      - poly fmt --fix .

  check:
    desc: Run all checks (lint plus test)
    cmds:
      - task: lint
      - task: test

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  update:
    desc: Update dependencies and governance hooks
    cmds:
      - cargo update
      - poly hooks update
      - poly hooks install

  ai:hooks:
    desc: Install governance hooks while preserving local preferences
    cmds:
      - >-
        python3 -c 'from pathlib import Path;
        p = Path("poly.local.toml");
        p.exists() or p.write_text("[hook_preferences]\nchannels = [\"system\"]\n")'
      - poly hooks update
      - poly hooks install

  ai:validate:
    desc: Validate the ai-rulez configuration and generated outputs
    cmds:
      - ai-rulez validate --strict --no-local
      - ai-rulez lock --check
      - ai-rulez generate --no-local --strict-config --check
