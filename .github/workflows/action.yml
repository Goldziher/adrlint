name: Action

# Exercises action.yml itself (uses: ./) rather than the CLI. Pinned to the last published
# release; bump this when a release is cut.
on:
  pull_request:
    paths:
      - "action.yml"
      - "problem-matcher.json"
      - "scripts/gh-action-*.sh"
      - ".github/workflows/action.yml"
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "problem-matcher.json"
      - "scripts/gh-action-*.sh"
      - ".github/workflows/action.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ADRLINT_ACTION_TEST_VERSION: "0.4.0"

jobs:
  release:
    name: Check release availability
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check whether the pinned release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${ADRLINT_ACTION_TEST_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "v${ADRLINT_ACTION_TEST_VERSION} is not published yet; skipping the action test."
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.available == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/clean tmp/violate
          printf '[adr]\ndir = "tmp/clean"\n' > .adrlint.toml
          printf '# A clean record\n\n## Context and Problem Statement\n\nContext.\n\n## Considered Options\n\n* One\n\n## Decision Outcome\n\nChosen option: "One", because it exists.\n' > tmp/clean/0001-clean.md
          printf '# Starts too high\n\n## Context and Problem Statement\n\nContext.\n\n## Considered Options\n\n* One\n\n## Decision Outcome\n\nChosen option: "One", because it exists.\n' > tmp/violate/0003-high.md

      - name: Install only
        id: install-only
        uses: ./
        with:
          version: ${{ env.ADRLINT_ACTION_TEST_VERSION }}
          install-only: "true"

      - name: Assert install-only installed the pinned version and ran nothing
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.install-only.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$INSTALLED_VERSION" != "$ADRLINT_ACTION_TEST_VERSION" ]; then
            echo "::error::expected output version $ADRLINT_ACTION_TEST_VERSION, got '$INSTALLED_VERSION'"
            exit 1
          fi
          got="$(adrlint --version)"
          case "$got" in
            *"$ADRLINT_ACTION_TEST_VERSION"*) ;;
            *)
              echo "::error::expected adrlint --version to mention $ADRLINT_ACTION_TEST_VERSION, got: $got"
              exit 1
              ;;
          esac

      - name: Lint a clean fixture (expected to pass)
        uses: ./
        with:
          version: ${{ env.ADRLINT_ACTION_TEST_VERSION }}
          args: "lint tmp/clean"

      - name: Lint a violating fixture (expected to fail)
        id: lint-violation
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.ADRLINT_ACTION_TEST_VERSION }}
          args: "lint tmp/violate"

      - name: Assert the violating fixture failed the gate
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.lint-violation.outcome }}
        run: |
          set -euo pipefail
          if [ "$LINT_OUTCOME" != "failure" ]; then
            echo "::error::expected the lint step against tmp/violate to fail, got '$LINT_OUTCOME'"
            exit 1
          fi
          echo "Confirmed: the violating fixture failed the gate as expected."
