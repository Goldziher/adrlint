name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Every job states the permissions it needs. `id-token: write` is granted only to the jobs that
# exchange an OIDC token for a registry credential, never workflow-wide.
permissions:
  contents: read

jobs:
  meta:
    name: Resolve versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      tag: ${{ steps.version.outputs.tag }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
      npm_exists: ${{ steps.published.outputs.npm_exists }}
      pypi_exists: ${{ steps.published.outputs.pypi_exists }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
    steps:
      # Validate before checkout, builds or any registry call so a malformed or hostile ref cannot
      # reach a later step at all.
      - name: Validate the release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          # A tag name is attacker-controlled input that reaches `gh release create`, so it must be
          # shaped like a release before any of it is used.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to release '$tag': expected v<major>.<minor>.<patch> with an optional -<suffix>."
            exit 1
          fi

          version="${tag#v}"
          python_version="$(echo "$version" | sed 's/-rc\.//g; s/-rc/rc/')"

          {
            echo "version=$version"
            echo "python_version=$python_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Cargo/npm version: $version"
          echo "Python version: $python_version"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Verify version consistency across all surfaces
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYTHON_VERSION: ${{ steps.version.outputs.python_version }}
        run: |
          set -euo pipefail
          target_version="$VERSION"
          target_python_version="$PYTHON_VERSION"

          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target_version" ]; then
            echo "::error::Cargo.toml version mismatch: expected $target_version, got $cargo_version"
            exit 1
          fi

          npm_version="$(jq -r '.version' npm-package/package.json)"
          if [ "$npm_version" != "$target_version" ]; then
            echo "::error::npm-package/package.json version mismatch: expected $target_version, got $npm_version"
            exit 1
          fi

          pypi_version="$(grep -E '^version = "' pip-package/pyproject.toml | head -1 | cut -d'"' -f2)"
          if [ "$pypi_version" != "$target_python_version" ]; then
            echo "::error::pip-package/pyproject.toml version mismatch: expected $target_python_version, got $pypi_version"
            exit 1
          fi

          init_version="$(grep -E '^__version__ = "' pip-package/adrlint/__init__.py | cut -d'"' -f2)"
          if [ "$init_version" != "$target_python_version" ]; then
            echo "::error::pip-package/adrlint/__init__.py version mismatch: expected $target_python_version, got $init_version"
            exit 1
          fi

          echo "All version surfaces match: $target_version"

      - name: Detect already-published versions
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYTHON_VERSION: ${{ steps.version.outputs.python_version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          python_version="$PYTHON_VERSION"

          crates_exists=false
          if curl -fsS "https://crates.io/api/v1/crates/adrlint/${version}" >/dev/null; then
            crates_exists=true
          fi

          npm_exists=false
          if npm view "adrlint@${version}" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          pypi_exists=false
          if curl -fsS "https://pypi.org/pypi/adrlint/${python_version}/json" >/dev/null; then
            pypi_exists=true
          fi

          {
            echo "crates_exists=$crates_exists"
            echo "npm_exists=$npm_exists"
            echo "pypi_exists=$pypi_exists"
          } >> "$GITHUB_OUTPUT"

          echo "Already published?"
          echo "  crates.io: $crates_exists"
          echo "  npm:       $npm_exists"
          echo "  PyPI:      $pypi_exists"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          release_assets_exist=false

          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            release_assets_exist=true
            for asset in adrlint-x86_64-unknown-linux-gnu.tar.gz adrlint-aarch64-unknown-linux-gnu.tar.gz \
              adrlint-aarch64-apple-darwin.tar.gz adrlint-x86_64-apple-darwin.tar.gz \
              adrlint-x86_64-pc-windows-msvc.zip; do
              if ! grep -Fxq "$asset" <<< "$assets"; then
                release_assets_exist=false
              fi
            done
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "GitHub release assets exist? $release_assets_exist"

  # Nothing is built or published until the tagged commit passes the same gates CI enforces.
  verify:
    name: Verify the tagged commit
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.94"
          components: clippy, rustfmt

      - name: Setup cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: verify

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Check licenses, bans, advisories and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  create_release:
    name: Create GitHub release (draft)
    needs: [meta, verify]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.meta.outputs.release_assets_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the GitHub release exists as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --draft $prerelease
          fi

  build-macos:
    name: Build macOS / ${{ matrix.triple }}
    needs: [meta, verify, create_release]
    if: needs.verify.result == 'success' && needs.create_release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-latest
          - triple: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.triple }}

      - name: Setup cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.triple }}

      - name: Build release binary
        env:
          TRIPLE: ${{ matrix.triple }}
        run: cargo build --release --bin adrlint --target "$TRIPLE"

      - name: Package archive
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tar czf "adrlint-${TRIPLE}.tar.gz" -C "target/${TRIPLE}/release" adrlint

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: gh release upload "$TAG" "adrlint-${TRIPLE}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  build-windows:
    name: Build Windows / x86_64-pc-windows-msvc
    needs: [meta, verify, create_release]
    if: needs.verify.result == 'success' && needs.create_release.result == 'success'
    # rumdl depends on tikv-jemallocator on every target except msvc and wasm; tikv-jemalloc-sys
    # cannot link against the mingw runtime, so the Windows archive is built on Windows with the
    # MSVC toolchain rather than cross-compiled on Linux.
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.94"
          targets: x86_64-pc-windows-msvc

      - name: Setup cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --bin adrlint --target $env:TRIPLE

      - name: Package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "target/$env:TRIPLE/release/adrlint.exe"
          if (-not (Test-Path $binary)) {
            throw "$binary was not produced by the build"
          }
          $archive = "adrlint-$env:TRIPLE.zip"
          Compress-Archive -Path $binary -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Upload to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$env:TAG" "adrlint-$env:TRIPLE.zip" --clobber --repo "$env:GITHUB_REPOSITORY"

  build-linux:
    name: Build Linux / ${{ matrix.triple }}
    needs: [meta, verify, create_release]
    if: needs.verify.result == 'success' && needs.create_release.result == 'success'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
            rustup_arch: x86_64
            rustup_init_sha256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
            rustup_arch: aarch64
            rustup_init_sha256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # The manylinux images ship no Rust. Installing rustup by piping a remote script into a shell
      # executes whatever that URL serves; instead the versioned rustup-init binary is fetched and
      # checked against the digest pinned in the matrix before it runs.
      - name: Install Rust (in container)
        env:
          RUSTUP_VERSION: "1.28.2"
          RUSTUP_ARCH: ${{ matrix.rustup_arch }}
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_init_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSLo rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUSTUP_ARCH}-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  rustup-init" | sha256sum -c -
          chmod +x rustup-init
          export CARGO_HOME=/opt/cargo
          export RUSTUP_HOME=/opt/rustup
          ./rustup-init -y --profile minimal --no-modify-path --default-toolchain 1.94
          rm -f rustup-init
          {
            echo "CARGO_HOME=/opt/cargo"
            echo "RUSTUP_HOME=/opt/rustup"
            echo "RUSTUP_TOOLCHAIN=1.94"
          } >> "$GITHUB_ENV"
          echo "/opt/cargo/bin" >> "$GITHUB_PATH"

      - name: Install gh CLI (in container)
        run: |
          set -euo pipefail
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      - name: Build release binary
        env:
          TRIPLE: ${{ matrix.triple }}
        run: cargo build --release --bin adrlint --target "$TRIPLE"

      - name: Package archive
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tar czf "adrlint-${TRIPLE}.tar.gz" -C "target/${TRIPLE}/release" adrlint

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE:-/__w/adrlint/adrlint}"
          gh release upload "$TAG" "adrlint-${TRIPLE}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    name: Generate and upload checksums
    needs: [meta, build-macos, build-windows, build-linux]
    if: needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify all 5 archives are present, then generate checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version="$VERSION"

          expected=(
            "adrlint-x86_64-unknown-linux-gnu.tar.gz"
            "adrlint-aarch64-unknown-linux-gnu.tar.gz"
            "adrlint-aarch64-apple-darwin.tar.gz"
            "adrlint-x86_64-apple-darwin.tar.gz"
            "adrlint-x86_64-pc-windows-msvc.zip"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > /tmp/assets.txt || true
          missing=0
          for asset in "${expected[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::Missing expected archive: $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::Release incomplete: $missing of 5 archives missing."
            exit 1
          fi
          echo "All 5 archives present"

          for asset in "${expected[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$asset" -O "$asset"
          done
          sha256sum adrlint-*.tar.gz adrlint-*.zip | sort > "adrlint_${version}_checksums.txt"
          cat "adrlint_${version}_checksums.txt"
          gh release upload "$tag" "adrlint_${version}_checksums.txt" --clobber --repo "$GITHUB_REPOSITORY"

  finalize_release:
    name: Publish GitHub release
    needs: [meta, verify, checksums]
    # `checksums` is skipped only when `meta` found every archive already on the release (a re-run),
    # and this job verifies all six assets itself before promoting, so a skip is not trusted blindly.
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && (needs.checksums.result == 'success' || needs.checksums.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft to published once complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version="$VERSION"

          required=(
            "adrlint-x86_64-unknown-linux-gnu.tar.gz"
            "adrlint-aarch64-unknown-linux-gnu.tar.gz"
            "adrlint-aarch64-apple-darwin.tar.gz"
            "adrlint-x86_64-apple-darwin.tar.gz"
            "adrlint-x86_64-pc-windows-msvc.zip"
            "adrlint_${version}_checksums.txt"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > /tmp/assets.txt || true
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $tag is missing $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $tag is incomplete ($missing assets missing); leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "Promoted $tag to a published release"

  float_major_tag:
    name: Float the major tag
    needs: [meta, verify, finalize_release]
    if: needs.verify.result == 'success' && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    # Repository tag rules can reject a ref update made with the workflow token. The release and
    # every package are already published at this point, so a protected tag must not fail the run;
    # move it manually instead.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Move the major tag onto this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          major="${tag%%.*}"

          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" \
              -F sha="$sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${major}" -f sha="$sha" >/dev/null
          fi
          echo "${major} now points at ${tag} (${sha})"

  verify-binstall:
    name: Verify cargo-binstall install
    needs: [meta, verify, finalize_release]
    if: needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.release_assets_exist != 'true'
    permissions:
      contents: read
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@793d3a4d37a17009d91cce29f2825eda570d2abd # v1.27.1
    with:
      package-name: adrlint
      binary-name: adrlint
      manifest-path: .
      checkout-ref: ${{ needs.meta.outputs.tag }}
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      smoke-command: |
        adrlint --version

  publish_crates:
    name: Publish crates.io
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.crates_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates-io-auth-action exchanges this for a scoped registry token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.94"

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates_auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          set -euo pipefail
          if cargo publish 2>cargo-publish.err; then
            exit 0
          fi

          if grep -Eq "crate .* already exists" cargo-publish.err; then
            echo "crate already published; skipping"
            exit 0
          fi

          cat cargo-publish.err >&2
          exit 1

  publish_npm:
    name: Publish npm
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.npm_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `npm publish --provenance` exchanges the workflow's OIDC identity for a short-lived
      # npm token (trusted publishing); without this the upload is rejected.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          cd npm-package
          version="$VERSION"
          if [[ "$version" == *"-rc."* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          npm publish --provenance --access public --tag "$npm_tag"

  publish_pypi:
    name: Publish PyPI
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.pypi_exists != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # PyPI trusted publishing: gh-action-pypi-publish mints the upload token over OIDC.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          cd pip-package
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Generate formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "HOMEBREW_TOKEN not set; skipping the Homebrew formula update."
            exit 0
          fi
          tag="$TAG"
          version="$VERSION"
          gh release download "$tag" -p "adrlint_${version}_checksums.txt" -O checksums.txt
          ./scripts/update-homebrew-formula.sh "$version" checksums.txt > adrlint.rb

          # The credential is passed to git through the environment (GIT_CONFIG_*), so it never
          # appears in argv or in the clone's .git/config.
          basic="$(printf 'x-access-token:%s' "$HOMEBREW_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"

          git clone --depth 1 https://github.com/Goldziher/homebrew-tap.git tap
          cp adrlint.rb tap/Formula/adrlint.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/adrlint.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "adrlint ${version}"
            git push
          fi

  publish_scoop:
    name: Update Scoop manifest
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Deliberately checked out at the workflow revision, not the tag: this job only needs the
      # generator script and the published assets, and older tags may predate the script.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate manifest and push to the Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with push access to Goldziher/scoop-bucket. The same token already maintains the
          # Homebrew tap, so one secret covers both taps.
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "HOMEBREW_TOKEN not set; skipping the Scoop manifest update."
            exit 0
          fi
          tag="$TAG"
          version="$VERSION"
          gh release download "$tag" -p "adrlint_${version}_checksums.txt" -O checksums.txt
          ./scripts/update-scoop-manifest.sh "$version" checksums.txt > adrlint.json

          # The credential is passed to git through the environment (GIT_CONFIG_*), so it never
          # appears in argv or in the clone's .git/config.
          basic="$(printf 'x-access-token:%s' "$HOMEBREW_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"

          git clone --depth 1 https://github.com/Goldziher/scoop-bucket.git bucket-repo
          cp adrlint.json bucket-repo/bucket/adrlint.json
          cd bucket-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/adrlint.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already up to date."
          else
            git commit -m "adrlint ${version}"
            git push
          fi
