name: AI-Rulez validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-ai-rulez@v1
        with:
          ai-rulez-version: "5.9.2"
      - uses: xberg-io/actions/validate-ai-rulez@v1
        with:
          expected-config-count: "1"
      - name: Verify the lock and generated outputs
        run: |
          ai-rulez lock --check
          ai-rulez generate --no-local --strict-config --check
